status-website:
  #baseUrl: /uptime # "repo" is your repository name
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  cname: uptime.josemoreira.pt
  # baseUrl: /your-repo-name
  logoUrl: https://raw.githubusercontent.com/giventofly/uptime/refs/heads/master/assets/Custom_SNEK_yellow_bg_clearer.png
  name: Upty 
  #introTitle: some uptime tracking, with dracula theme
  #introMessage: 
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
  theme: dark
  themeUrl: https://cdn.jsdelivr.net/gh/giventofly/uptime@master/assets/themes/tokyo-night.css

# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration

# Short labels for the compact status rows
i18n:
  overallUptime: "$UPTIME"
  averageResponseTime: "$TIMEms"

workflowSchedule:
  graphs: "0 0 * * *"
  responseTime: "15 2-22/4 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"
  updateTemplate: "0 0 * * *"
  updates: "0 3 * * *"
  uptime: "0 */2 * * *"

user-agent: github-checker
